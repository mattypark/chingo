name: ChinGo
options:
  bundleIdPrefix: com.matthewpark
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  ChinGoDesign:
    path: ChinGoDesign
  # The renderer only. The official swiftui-dsl wrapper is pre-1.0 and consumers pin it to
  # `main`, which means breaking API changes land with no semver warning; MLNMapView is
  # wrapped by hand in MapLibreMap.swift instead, for one versioned dependency rather than two.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0

targets:
  ChinGo:
    type: application
    platform: iOS
    sources:
      - path: ChinGo
      # Documents the real Secrets.xcconfig, which is gitignored. It has no business
      # shipping inside the app bundle.
      - path: ChinGo/Secrets.xcconfig.example
        buildPhase: none
    dependencies:
      - package: ChinGoDesign
      - package: ChinGoDesign
        product: ChinGoEngine
      - package: MapLibre
        product: MapLibre
    info:
      path: ChinGo/Info.plist
      properties:
        CFBundleDisplayName: ChinGo
        # Wired to the build settings on purpose. XcodeGen writes a default 1.0 / 1 into the
        # plist otherwise, and MARKETING_VERSION then does nothing — you bump the version,
        # upload, and App Store Connect rejects the build as a duplicate of one you thought
        # you had superseded.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Deliberately just a colour, with no logo on it. Apple requires the launch screen
        # to be nearly identical to the first screen, and SplashView's first frame is this
        # exact flat field -- which is what makes the handoff invisible. The mascot then
        # animates in from code, where branding is allowed.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Deliberately NOT set. Unlocking 120Hz on a screen that renders a tilted vector
        # map continuously alongside GPS is a straight battery cost, and battery drain is
        # something reviewers and users both notice on location apps. 60fps is enough for
        # a map that moves at walking pace.

        # Bare filenames. The build flattens Resources/Fonts and copies both faces to the
        # bundle root; a path that does not resolve fails silently and SwiftUI quietly
        # substitutes the system font. FontRegistration.assertBundled() turns that into a
        # debug crash.
        UIAppFonts:
          - BagelFatOne-Regular.ttf
          - GloriaHallelujah-Regular.ttf

        # Only ever "when in use". A social map app asking for Always is exactly the
        # posture that has 37 state attorneys general writing letters, and ChinGo does
        # not need it: discovery is a per-session switch, not a background service.
        NSLocationWhenInUseUsageDescription: >-
          ChinGo shows the places you and your friends have been, and lets you catch
          friends you are standing next to. Your location is never shared with anyone
          unless you turn yourself visible, and it is never precise to other people.
        NSPhotoLibraryUsageDescription: >-
          ChinGo finds photos you already took with friends and pins them to the places
          they happened. The photos stay on your phone.
        NSCameraUsageDescription: >-
          ChinGo takes the photo that makes a catch, so you both keep the moment you met.
        NSLocalNetworkUsageDescription: >-
          ChinGo confirms you and a friend are really standing together before it lets you
          catch each other.
        NSNearbyInteractionUsageDescription: >-
          ChinGo uses the U1 chip to tell whether a friend is right next to you.
        NSMotionUsageDescription: >-
          ChinGo uses motion to tell whether you are walking or standing still, so your
          character on the map moves the way you do.

        # Declaring this false skips the export-compliance questionnaire on every
        # TestFlight upload. True only if non-exempt cryptography is ever added; HTTPS
        # alone is exempt.
        ITSAppUsesNonExemptEncryption: false

        # Populated from Secrets.xcconfig, which is gitignored. Absent means the app runs
        # on seeded mock data, which is a working state rather than a broken one.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        TILE_BASE_URL: $(TILE_BASE_URL)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - chingo
    # Declaring a capability is also what forces an explicit App ID to exist. Without one the
    # app signs against the team's wildcard profile, which works fine for building but means
    # App Store Connect's bundle-ID list never shows it — there is nothing registered to show.
    entitlements:
      path: ChinGo/ChinGo.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewpark.chingo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_UPCOMING_FEATURE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        # The team Xcode is actually signed into on this machine -- the same one Fitti
        # ships with, which already has a wildcard profile and the devices registered.
        # The personal Apple Development cert in the keychain (274Z73Q329) is NOT usable:
        # its Apple ID is not added in Xcode's Accounts, so builds fail with "No Account
        # for Team", which does not obviously mean "sign in".
        DEVELOPMENT_TEAM: R43H5332KH
        GENERATE_INFOPLIST_FILE: NO

# XcodeGen emits no shared scheme unless one is declared, and xcodebuild then refuses to
# build at all with "Found no destinations for the scheme".
schemes:
  ChinGo:
    build:
      targets:
        ChinGo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
